ShortDescription: Фоновый переводчик в стиле Spotlight для Windows, macOS и Linux.
Description: Лёгкий фоновый переводчик, который живёт в трее и открывается поверх любых окон по глобальному шорткату. Переводит по мере ввода через Google или Bing без API-ключей, показывает транскрипцию и словарные статьи, озвучивает текст и копирует результат по Enter.
